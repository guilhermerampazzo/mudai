name: mudai

services:
  api:
    build: { context: ., dockerfile: docker/api/Dockerfile }
    restart: unless-stopped
    env_file: [.env]
    volumes: [storage:/data/storage]
    networks: [appnet]

  web:
    build: { context: ., dockerfile: docker/web/Dockerfile }
    restart: unless-stopped
    depends_on: [api]
    networks: [appnet]

  gateway:
    build: { context: ./docker/gateway }
    restart: unless-stopped
    depends_on: [web, api]
    ports: ["127.0.0.1:${GATEWAY_PORT:-10233}:80"]
    networks: [appnet]

networks:
  appnet: { driver: bridge }

volumes:
  storage: {}
