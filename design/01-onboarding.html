<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mudaí — Boas-vindas</title>
<link rel="stylesheet" href="src/styles.css">
<style>
  .hero-art { position: relative; height: 380px; overflow: hidden; border-radius: 0 0 36px 36px;
    background: linear-gradient(160deg, #d8f3dc 0 40%, #95d5b2 40% 62%, #e9b44c 62% 74%, #fffdf8 74%); }
  .hero-art svg.leaf { position: absolute; }
  .sun { position: absolute; top: 34px; right: 40px; width: 64px; height: 64px;
    background: #e9b44c; border-radius: 50%; border: 5px solid #1b4332; }
</style>
</head>
<body>
<div class="phone">
  <div class="screen">
    <div class="hero-art">
      <div class="sun"></div>
      <svg class="leaf" style="left:18px;top:60px" width="120" height="150" viewBox="0 0 120 150">
        <rect x="8" y="8" width="48" height="60" rx="6" fill="#1b4332"/>
        <circle cx="82" cy="40" r="26" fill="#52b788"/>
        <path d="M20 110 q30 -34 76 -20 l-8 34 q-40 8 -68 -14z" fill="#2d6a4f"/>
      </svg>
      <svg class="leaf" style="right:10px;top:150px" width="150" height="190" viewBox="0 0 150 190">
        <rect x="86" y="10" width="44" height="60" rx="6" fill="#1b4332"/>
        <path d="M20 130 q10 -60 60 -80 q6 52 -20 84 q-24 10 -40 -4z" fill="#40916c" stroke="#1b4332" stroke-width="5"/>
        <circle cx="50" cy="150" r="16" fill="#e9b44c" stroke="#1b4332" stroke-width="5"/>
        <path d="M100 120 h26 v44 h-26z" fill="#95d5b2" stroke="#1b4332" stroke-width="5"/>
      </svg>
      <svg class="leaf" style="left:30px;top:200px" width="110" height="140" viewBox="0 0 110 140">
        <path d="M14 60 h22 l-4 56 a8 8 0 0 1-8 8 h-6 a8 8 0 0 1-8-8z" fill="#fffdf8" stroke="#1b4332" stroke-width="5"/>
        <path d="M25 60 C 25 30, 40 18, 60 14 M25 60 C 40 56, 60 60, 78 78" stroke="#2d6a4f" stroke-width="7" fill="none" stroke-linecap="round"/>
        <ellipse cx="62" cy="16" rx="10" ry="7" fill="#52b788"/>
        <ellipse cx="80" cy="78" rx="10" ry="7" fill="#52b788"/>
      </svg>
    </div>
    <div class="pad" style="padding-top:22px">
      <h1>Mudaí que sua planta agradece</h1>
      <p style="margin-top:8px">Luz, água, sol e um jardineiro no bolso. Cuide das suas verdinhas como pets.</p>
      <button class="btn btn-primary btn-block" style="margin-top:20px">Começar</button>
      <button class="btn btn-ghost btn-block" style="margin-top:10px">Já tenho conta</button>
      <p class="small center" style="margin-top:14px">Grátis · sem cadastro chato</p>
    </div>
  </div>
</div>
</body>
</html>
