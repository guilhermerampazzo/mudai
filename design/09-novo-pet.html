<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mudaí — Novo pet</title>
<link rel="stylesheet" href="src/styles.css">
</head>
<body>
<div class="phone">
  <div class="screen">
    <div class="topbar">
      <span class="icon-btn"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg></span>
      <h2 class="center">Novo pet</h2><span style="width:42px"></span>
    </div>
    <div class="pad" style="padding-top:6px">
      <div class="card center" style="padding:26px;background:linear-gradient(150deg,#d8f3dc,#fffdf8 80%)">
        <img src="src/plants/samambaia.svg" alt="" style="width:110px;height:110px;object-fit:contain">
        <p class="small" style="margin-top:8px;font-weight:800">📷 Trocar foto</p>
      </div>
      <div class="field" style="margin-top:16px"><label>Apelido do pet</label><input value="Sammy"></div>
      <div class="field"><label>Espécie</label><select><option>Samambaia (Nephrolepis)</option><option>Jiboia</option><option>Zamioculca</option><option>Outra…</option></select></div>
      <div class="field"><label>Onde ela fica?</label>
        <div class="row" style="flex-wrap:wrap">
          <span class="chip active">🛋️ Sala</span><span class="chip">🪟 Janela</span>
          <span class="chip">🛏️ Quarto</span><span class="chip">🌿 Varanda</span>
        </div>
      </div>
      <div class="card" style="padding:14px 16px">
        <b style="font-size:13.5px">☀️ Luz medida aqui: 1.800 lux</b>
        <p class="small">Perfeito p/ samambaia (ideal 1.000–3.000). Pode adotar sem medo.</p>
      </div>
      <button class="btn btn-primary btn-block" style="margin-top:16px">🌱 Adotar a Sammy</button>
      <div style="height:10px"></div>
    </div>
  </div>
</div>
</body>
</html>
