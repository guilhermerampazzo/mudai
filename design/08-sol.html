<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mudaí — Posição do sol</title>
<link rel="stylesheet" href="src/styles.css">
<style>
  .compass { position: relative; width: 250px; height: 250px; margin: 6px auto; border-radius: 50%;
    background: radial-gradient(circle, #fffdf8 0 52%, #d8f3dc 53% 78%, #95d5b2 79%); border: 1.5px solid var(--line); }
  .compass .tick { position: absolute; font-size: 11px; font-weight: 800; color: var(--muted); }
  .sun-dot { position: absolute; width: 46px; height: 46px; border-radius: 50%; background: var(--mustard);
    border: 4px solid #fff; box-shadow: 0 4px 14px rgba(233,180,76,.6);
    display: flex; align-items: center; justify-content: center; font-size: 22px; }
  .needle { position: absolute; left: 50%; top: 50%; width: 4px; height: 104px; transform-origin: 50% 0;
    background: linear-gradient(180deg, var(--terra), transparent); border-radius: 4px; }
  .arc { height: 110px; border-radius: var(--r-md); background: linear-gradient(180deg,#fdf3d7,#fffdf8);
    border: 1.5px solid var(--mustard-soft); position: relative; overflow: hidden; margin-top: 12px; }
  .arc svg { width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="phone">
  <div class="screen">
    <div class="topbar"><div class="grow"><h2>Posição do sol</h2><p class="small">📍 São Paulo · agora 14:32</p></div>
      <span class="icon-btn"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></span></div>
    <div class="pad" style="padding-top:10px">
      <div class="compass">
        <span class="tick" style="top:8px;left:50%;transform:translateX(-50%)">N</span>
        <span class="tick" style="bottom:8px;left:50%;transform:translateX(-50%)">S</span>
        <span class="tick" style="left:10px;top:50%;transform:translateY(-50%)">O</span>
        <span class="tick" style="right:10px;top:50%;transform:translateY(-50%)">L</span>
        <div class="needle" style="transform:rotate(48deg)"></div>
        <div class="sun-dot" style="left:176px;top:44px">☀️</div>
        <div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center">
          <b style="font-size:26px">48°</b><br><span class="small" style="font-weight:800">NE · elev. 52°</span>
        </div>
      </div>
      <div class="row" style="margin-top:6px">
        <div class="card grow center" style="padding:12px"><span class="small">🌅 NASCE</span><b>06:12</b></div>
        <div class="card grow center" style="padding:12px"><span class="small">🔆 PICO</span><b>12:40</b></div>
        <div class="card grow center" style="padding:12px"><span class="small">🌇 PÕE</span><b>18:05</b></div>
      </div>
      <div class="arc">
        <svg viewBox="0 0 320 110" preserveAspectRatio="none">
          <path d="M20 95 Q 160 -30 300 95" fill="none" stroke="#e9b44c" stroke-width="5" stroke-linecap="round"/>
          <circle cx="208" cy="42" r="13" fill="#e9b44c" stroke="#fff" stroke-width="4"/>
          <circle cx="20" cy="95" r="7" fill="#c96f4a"/><circle cx="300" cy="95" r="7" fill="#c96f4a"/>
        </svg>
      </div>
      <p class="small center" style="margin-top:6px">Arco de hoje · o solzinho marca onde ele está agora</p>
      <div class="card" style="padding:16px;margin-top:12px;background:linear-gradient(120deg,var(--green-900),var(--green-700));border:none">
        <b style="color:#fff;font-size:14px">🪟 Minha janela · 4h de sol direto</b>
        <p style="color:rgba(255,255,255,.8);margin-top:4px">Apontada p/ NE — perfeita p/ meia-sombra. A Gordinha ia amar aí.</p>
        <button class="btn btn-mustard" style="margin-top:12px;padding:10px 22px">Recalibrar janela</button>
      </div>
      <div style="height:10px"></div>
    </div>
  </div>
  <nav class="tabbar">
    <a href="02-descobrir.html"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a2 2 0 01-2 2h-4v-6h-6v6H5a2 2 0 01-2-2z"/></svg></a>
    <a href="05-medidor.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg></a>
    <a href="06-identificar.html"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></a>
    <a href="07-chat.html"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 01-8 8H5l-2 2V12a8 8 0 018-8h2a8 8 0 018 8z"/></svg></a>
    <a href="08-sol.html" class="active"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15 9l-2 5-4 1 2-5z"/></svg></a>
  </nav>
</div>
</body>
</html>
