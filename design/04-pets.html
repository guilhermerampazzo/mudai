<body>
<div class="phone">
  <div class="screen">
    <div class="topbar"><div class="grow"><h2>Meus pets</h2><p class="small">3 verdinhas sob seus cuidados</p></div>
      <span class="icon-btn"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></span></div>
    <div class="pad" style="padding-top:10px">
      <div class="banner">
        <span class="small" style="color:#f6df9e;font-weight:800">REGAR HOJE</span>
        <div class="big">2 pets com sede</div>
        <p>Juju e a Echeveria precisam de água hoje.</p>
        <button class="btn btn-mustard" style="margin-top:12px;padding:10px 22px">Ver tarefas</button>
      </div>

      <div class="card row" style="padding:14px;margin-top:14px">
        <img src="src/plants/jiboia.svg" alt="Juju" style="width:64px;height:64px;object-fit:contain;background:var(--green-50);border-radius:16px">
        <div class="grow"><b>Juju</b><p class="small">Jiboia · Sala</p>
          <p class="small" style="color:var(--green-700);font-weight:800">😊 Feliz · regada há 2 dias</p></div>
        <div class="health-ring"><svg width="92" height="92"><circle cx="46" cy="46" r="38" fill="none" stroke="#eceee7" stroke-width="9"/><circle cx="46" cy="46" r="38" fill="none" stroke="#2d6a4f" stroke-width="9" stroke-linecap="round" stroke-dasharray="239" stroke-dashoffset="24"/></svg><div class="num"><b>90</b><span>saúde</span></div></div>
      </div>

      <div class="card row" style="padding:14px;margin-top:12px">
        <img src="src/plants/suculenta.svg" alt="Gordinha" style="width:64px;height:64px;object-fit:contain;background:#fdf3d7;border-radius:16px">
        <div class="grow"><b>Gordinha</b><p class="small">Echeveria · Janela</p>
          <p class="small" style="color:#c96f4a;font-weight:800">🥀 Com sede · regar hoje</p></div>
        <div class="health-ring"><svg width="92" height="92"><circle cx="46" cy="46" r="38" fill="none" stroke="#eceee7" stroke-width="9"/><circle cx="46" cy="46" r="38" fill="none" stroke="#e9b44c" stroke-width="9" stroke-linecap="round" stroke-dasharray="239" stroke-dashoffset="96"/></svg><div class="num"><b>60</b><span>saúde</span></div></div>
      </div>

      <div class="card row" style="padding:14px;margin-top:12px">
        <img src="src/plants/zamioculca.svg" alt="Zaza" style="width:64px;height:64px;object-fit:contain;background:var(--green-50);border-radius:16px">
        <div class="grow"><b>Zazá</b><p class="small">Zamioculca · Quarto</p>
          <p class="small" style="color:var(--green-700);font-weight:800">😊 Feliz · luz perfeita</p></div>
        <div class="health-ring"><svg width="92" height="92"><circle cx="46" cy="46" r="38" fill="none" stroke="#eceee7" stroke-width="9"/><circle cx="46" cy="46" r="38" fill="none" stroke="#2d6a4f" stroke-width="9" stroke-linecap="round" stroke-dasharray="239" stroke-dashoffset="14"/></svg><div class="num"><b>94</b><span>saúde</span></div></div>
      </div>

      <button class="btn btn-ghost btn-block" style="margin-top:14px">+ Adotar nova planta</button>
    </div>
